name: Deploy Shared Services Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/environments/shared-services/**'
      - 'infrastructure/modules/**'

concurrency:
  group: shared-services-deployment
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan (Shared Services)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: infrastructure/environments/shared-services

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_SHARED_SERVICES_CICD_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: github-run-id-${{ github.run_id }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validation Check
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars -out tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tf-plan-shared-services-${{ github.sha }}
          path: infrastructure/environments/shared-services/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform Apply (Shared Services)
    runs-on: ubuntu-24.04
    environment: shared-services

    needs: [plan]

    defaults:
      run:
        working-directory: infrastructure/environments/shared-services

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_SHARED_SERVICES_CICD_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: github-run-id-${{ github.run_id }}

      - name: Terraform Init
        run: |
          terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tf-plan-shared-services-${{ github.sha }}
          path: infrastructure/environments/shared-services

      - name: Terraform Apply
        run: |
          terraform apply tfplan